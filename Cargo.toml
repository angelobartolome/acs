[package]
name = "acs-solver"
version = "0.1.8"
edition = "2024"
authors = ["Angelo Bartolome <angelo.m.bartolome@gmail.com>"]
description = "A geometric constraint solver written in Rust with WebAssembly bindings for web applications."
license = "MIT"
repository = "https://github.com/angelobartolome/acs"
readme = "README.md"
keywords = ["constraint-solver", "geometry", "cad", "sketch", "wasm"]
categories = ["mathematics", "graphics", "wasm"]
# Only the library ships in the crate: not the demo (wasm-demo/), tests, scripts, CI,
# docs/ or agent notes.
include = ["/src/**/*.rs", "/include/p3d_sketch_solver.h", "/README.md", "/USAGE.md", "/SPEC.md", "/LICENSE"]

[lib]
# The crate is `acs-solver` on crates.io (`acs` is taken); the library keeps the name `acs`
# (`use acs::…`, libacs.a).
name = "acs"
crate-type = ["cdylib", "rlib", "staticlib"]

[features]
# Exports the sketch solver C ABI (`P3DSketch_Solve` / `P3DSketch_Free`,
# include/p3d_sketch_solver.h) from the static library. Not needed for WASM.
c-abi = []

[dependencies]
wasm-bindgen = "0.2.84"
nalgebra = "0.33.2"
serde = { version = "1.0", features = ["derive"] }
# float_roundtrip: parse floats correctly rounded, so fixed values come back bit for bit.
serde_json = { version = "1.0", features = ["float_roundtrip"] }

[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = "s"
