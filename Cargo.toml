[package]
name = "acs"
version = "0.1.2"
edition = "2024"
authors = ["Angelo Bartolome <angelo.m.bartolome@gmail.com>"]
description = "A geometric constraint solver written in Rust with WebAssembly bindings for web applications."
license = "MIT"
repository = "https://github.com/angelobartolome/acs"

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]

[features]
# Exports the sketch solver C ABI (`P3DSketch_Solve` / `P3DSketch_Free`,
# include/p3d_sketch_solver.h) from the static library. Not needed for WASM.
c-abi = []

[dependencies]
wasm-bindgen = "0.2.84"
nalgebra = "0.33.2"
serde = { version = "1.0", features = ["derive"] }
# float_roundtrip: parse floats correctly rounded, so fixed values come back bit for bit.
serde_json = { version = "1.0", features = ["float_roundtrip"] }

[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = "s"
