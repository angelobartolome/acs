name: Release

# Pushing a tag vX.Y.Z (matching Cargo.toml's version) builds the release artifacts and
# publishes them as a GitHub Release, then publishes the crate (acs-solver) to crates.io with
# the CARGO_REGISTRY_TOKEN secret. A manual run, or a pull request that changes the release
# machinery, builds the same artifacts and attaches them to the run without publishing.
#
# The pieces build in parallel jobs, each on its own runner: one macOS job per Apple platform
# (scripts/release.sh <platform>), the WASM npm package on Linux, and lint + tests alongside.
on:
  push:
    tags: ["v*"]
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/release.yml"
      - "scripts/release.sh"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the crate version
        id: version
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches the crate version
        if: github.ref_type == 'tag'
        run: |
          if [ "$GITHUB_REF_NAME" != "v${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match Cargo.toml's version ${{ steps.version.outputs.version }}"
            exit 1
          fi

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy --no-self-update

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Lint
        run: cargo clippy --all-targets --all-features

      - name: Test
        run: cargo test --features c-abi

      - name: Check the crate packages
        run: cargo publish --dry-run

  apple:
    needs: version
    # The iOS and iOS Simulator static libraries need Xcode's SDKs.
    runs-on: macos-latest
    strategy:
      matrix:
        platform: [macos-arm64, ios-arm64, ios-arm64-simulator]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}

      - name: Build the static library
        run: ./scripts/release.sh ${{ matrix.platform }}

      - name: Upload it to the run
        uses: actions/upload-artifact@v4
        with:
          name: acs-${{ needs.version.outputs.version }}-${{ matrix.platform }}
          path: dist/acs-${{ needs.version.outputs.version }}-${{ matrix.platform }}.tar.gz
          if-no-files-found: error

  wasm:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/wasm-release"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the WASM npm package
        run: ./scripts/release.sh wasm

      - name: Upload it to the run
        uses: actions/upload-artifact@v4
        with:
          name: acs-${{ needs.version.outputs.version }}-npm
          path: dist/acs-${{ needs.version.outputs.version }}.tgz
          if-no-files-found: error

  publish:
    needs: [version, check, apple, wasm]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect the artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: acs-${{ needs.version.outputs.version }}-*
          path: dist
          merge-multiple: true

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "ACS $VERSION" --generate-notes \
            "dist/acs-$VERSION-macos-arm64.tar.gz" \
            "dist/acs-$VERSION-ios-arm64.tar.gz" \
            "dist/acs-$VERSION-ios-arm64-simulator.tar.gz" \
            "dist/acs-$VERSION.tgz"

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Publish the crate to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
