name: Release

# Pushing a tag vX.Y.Z (matching Cargo.toml's version) builds the release artifacts with
# scripts/release.sh, publishes them as a GitHub Release and publishes the crate (acs-solver)
# to crates.io with the CARGO_REGISTRY_TOKEN secret. A manual run, or a pull request
# that changes the release machinery, builds the same artifacts and attaches them to the run
# without publishing.
on:
  push:
    tags: ["v*"]
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/release.yml"
      - "scripts/release.sh"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    # The iOS and iOS Simulator static libraries need Xcode's SDKs.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the crate version
        id: version
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches the crate version
        if: github.ref_type == 'tag'
        run: |
          if [ "$GITHUB_REF_NAME" != "v${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match Cargo.toml's version ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy --no-self-update

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lint
        run: cargo clippy --all-targets --all-features

      - name: Test
        run: cargo test --features c-abi

      - name: Check the crate packages
        run: cargo publish --dry-run

      - name: Build the release artifacts
        run: ./scripts/release.sh

      - name: Upload the artifacts to the run
        uses: actions/upload-artifact@v4
        with:
          name: acs-${{ steps.version.outputs.version }}
          path: |
            dist/acs-${{ steps.version.outputs.version }}-*.tar.gz
            dist/acs-${{ steps.version.outputs.version }}.tgz
          if-no-files-found: error

      - name: Publish the GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "ACS $VERSION" --generate-notes \
            "dist/acs-$VERSION-macos-arm64.tar.gz" \
            "dist/acs-$VERSION-ios-arm64.tar.gz" \
            "dist/acs-$VERSION-ios-arm64-simulator.tar.gz" \
            "dist/acs-$VERSION.tgz"

      - name: Publish the crate to crates.io
        if: github.ref_type == 'tag'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
